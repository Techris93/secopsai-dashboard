<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecOpsAI Intelligence UI preview</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#fbfaf6}</style>
</head>
<body>
  <iframe id="preview" title="SecOpsAI Intelligence preview"></iframe>
  <script>
    fetch('/index.html').then(response => response.text()).then(source => {
      const withoutScripts = source
        .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
        .replace(/href="\.\/styles\.css([^\"]*)"/i, 'href="/styles.css$1"');
      const frame = document.getElementById('preview');
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        doc.getElementById('auth-gate').hidden = true;
        doc.getElementById('auth-gate').style.display = 'none';
        const shell = doc.getElementById('app-shell');
        shell.classList.remove('auth-pending');
        shell.removeAttribute('aria-hidden');
        doc.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        doc.getElementById('page-integrations').classList.add('active');
        doc.querySelectorAll('.nav-btn').forEach(button => button.classList.toggle('active', button.dataset.page === 'integrations'));
        doc.getElementById('top-strip-context').textContent = 'System · health and integrations';
        doc.getElementById('integration-summary').innerHTML = [
          ['12','Open findings'],['1','Pending approval'],['0','Failed jobs'],['Ready','Core API']
        ].map(([value,label]) => `<div class="metric-card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`).join('');
        doc.getElementById('integration-config').hidden = true;
        doc.getElementById('intelligence-summary').innerHTML = [
          ['4','Recorded jobs'],['1','Queued'],['0','Running'],['0','Failed']
        ].map(([value,label]) => `<div class="metric-card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`).join('');
        doc.getElementById('intelligence-bridge-pill').textContent = 'Ready';
        doc.getElementById('intelligence-bridge-detail').innerHTML = '<div class="kv-row"><div class="kv-key">Queue mode</div><div class="kv-val">Local SQLite</div></div><div class="kv-row"><div class="kv-key">Codex</div><div class="kv-val">codex-cli 0.144.6</div></div><div class="kv-row"><div class="kv-key">Authentication</div><div class="kv-val">ChatGPT subscription</div></div><div class="kv-row"><div class="kv-key">Background service</div><div class="kv-val">Not installed</div></div><div class="kv-row"><div class="kv-key">Credential storage</div><div class="kv-val">Codex-owned; not stored by dashboard</div></div>';
        doc.getElementById('intelligence-mcp-pill').textContent = 'Setup required';
        doc.getElementById('intelligence-mcp-detail').innerHTML = '<div class="kv-row"><div class="kv-key">Mode</div><div class="kv-val">Read-only OAuth MCP</div></div><div class="kv-row"><div class="kv-key">Endpoint</div><div class="kv-val">Not configured in this dashboard</div></div><div class="kv-row"><div class="kv-key">Available tools</div><div class="kv-val">9 read-only tools</div></div><div class="kv-row"><div class="kv-key">Write access</div><div class="kv-val">None</div></div>';
        doc.getElementById('intelligence-jobs-table').innerHTML = '<div class="table-wrap"><table><thead><tr><th>Action</th><th>Target</th><th>Status</th><th>Updated</th><th>Result</th><th>Action</th></tr></thead><tbody><tr><td><strong>Analyze Research Case</strong><div class="small mono">AIJ-3356D244D94345D6</div><div class="small mono">opencodex:google-antigravity</div></td><td>RSC-42C6208F1F22</td><td>Succeeded</td><td>25 Jul, 02:28</td><td><button id="preview-open-full-analysis" class="secondary-btn mini-btn" type="button">Open full analysis</button><div class="small">Likely · 85% confidence</div></td><td></td></tr><tr><td><strong>Prioritize findings</strong><div class="small mono">AIJ-8C3E901DA4B7F122</div></td><td>Workspace</td><td>Queued</td><td>22 Jul, 14:01</td><td><span class="small">Pending</span></td><td><button class="mini-btn">Cancel</button></td></tr></tbody></table></div>';
        const modal = doc.getElementById('intelligence-result-modal');
        const openResult = () => {
          doc.getElementById('intelligence-result-title').textContent = 'Analyze Research Case';
          doc.getElementById('intelligence-result-subtitle').textContent = 'AIJ-3356D244D94345D6 · RSC-42C6208F1F22 · opencodex:google-antigravity';
          doc.getElementById('intelligence-result-body').innerHTML = `
            <div class="intelligence-result-meta"><span>Succeeded</span><span>25 Jul, 02:28</span><span>Read-only analysis</span></div>
            <div class="intelligence-verdict"><span>Agent verdict</span><strong>Likely</strong><b>85% confidence</b></div>
            <div class="intelligence-result-grid">
              <section class="intelligence-result-section wide"><h4>Executive summary</h4><p>Independent static validation supports a likely Braintree.Net typosquat with suspicious package behavior. Runtime card-skimming behavior is not yet proven.</p></section>
              <section class="intelligence-result-section tone-decision"><h4>Verdict rationale</h4><p>Package identity, hashes, lifecycle behavior, network indicators, and comparison evidence support escalation, while the credible threshold remains blocked by missing sandbox or advisory confirmation.</p></section>
              <section class="intelligence-result-section"><h4>Risk assessment</h4><p>High research priority because the package impersonates a payment library and exposes payment- and browser-related indicators.</p></section>
              <section class="intelligence-result-section tone-fact"><h4>Confirmed facts</h4><ol class="intelligence-result-list"><li>The suspicious package identity and version were collected from NuGet.</li><li>Artifact hashes and static indicators are recorded with provenance.</li><li>Install-hook, browser-payment-access, and network-endpoint indicators were detected statically.</li></ol></section>
              <section class="intelligence-result-section"><h4>Reasonable inferences</h4><ol class="intelligence-result-list"><li>The naming pattern is consistent with brand impersonation.</li><li>The indicators justify deeper .NET comparison and sandbox review.</li></ol></section>
              <section class="intelligence-result-section tone-warning"><h4>Unsupported claims</h4><ol class="intelligence-result-list"><li>Active credit-card skimming is not proven without observed runtime behavior.</li><li>Victims, attribution, and campaign scope are not established.</li></ol></section>
              <section class="intelligence-result-section tone-gap"><h4>Missing evidence</h4><ol class="intelligence-result-list"><li>Approved isolated sandbox execution and sanitized behavior logs.</li><li>Independent collection of every referenced package version.</li><li>Structured IOC extraction and validation.</li></ol></section>
              <section class="intelligence-result-section tone-action wide"><h4>Recommended next steps</h4><ol class="intelligence-result-list"><li>Compare suspicious and legitimate assemblies, metadata, resources, strings, and public APIs.</li><li>Request approval-gated sandbox analysis for the exact recorded artifact hash.</li><li>Prepare responsible disclosure for NuGet and the impersonated vendor after evidence review.</li></ol></section>
              <section class="intelligence-result-section tone-warning"><h4>Publication risks</h4><ol class="intelligence-result-list"><li>Describe static indicators separately from observed behavior.</li><li>Do not claim original discovery or confirmed skimming without source-backed proof.</li></ol></section>
              <section class="intelligence-result-section wide"><h4>Job audit history</h4><ol class="intelligence-result-list"><li>Queued by dashboard operator.</li><li>Claimed by local bridge.</li><li>Gemini analysis completed and normalized.</li></ol></section>
            </div>`;
          modal.classList.remove('hidden');
          modal.setAttribute('aria-hidden', 'false');
          doc.body.classList.add('modal-open');
        };
        const closeResult = () => {
          modal.classList.add('hidden');
          modal.setAttribute('aria-hidden', 'true');
          doc.body.classList.remove('modal-open');
        };
        doc.getElementById('preview-open-full-analysis').addEventListener('click', openResult);
        doc.getElementById('intelligence-result-close').addEventListener('click', closeResult);
        doc.getElementById('intelligence-result-done').addEventListener('click', closeResult);
        doc.querySelectorAll('#page-integrations > .card').forEach(card => card.hidden = true);
      }, { once: true });
      frame.srcdoc = withoutScripts;
    });
  </script>
</body>
</html>
