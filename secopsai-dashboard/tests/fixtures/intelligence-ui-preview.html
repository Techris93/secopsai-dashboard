<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecOpsAI Intelligence UI preview</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#fbfaf6}</style>
</head>
<body>
  <iframe id="preview" title="SecOpsAI Intelligence preview"></iframe>
  <script>
    fetch('/index.html').then(response => response.text()).then(source => {
      const withoutScripts = source
        .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
        .replace(/href="\.\/styles\.css([^\"]*)"/i, 'href="/styles.css$1"');
      const frame = document.getElementById('preview');
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        doc.getElementById('auth-gate').hidden = true;
        doc.getElementById('auth-gate').style.display = 'none';
        const shell = doc.getElementById('app-shell');
        shell.classList.remove('auth-pending');
        shell.removeAttribute('aria-hidden');
        doc.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        doc.getElementById('page-automation').classList.add('active');
        doc.querySelectorAll('.nav-btn').forEach(button => button.classList.toggle('active', button.dataset.page === 'automation'));
        doc.getElementById('top-strip-context').textContent = 'Automation · jobs and analysis';
        doc.querySelectorAll('[data-automation-tab]').forEach(button => {
          button.classList.toggle('active', button.dataset.automationTab === 'jobs');
        });
        doc.querySelectorAll('#page-automation [data-automation-view]').forEach(section => {
          section.hidden = section.dataset.automationView !== 'jobs';
        });
        doc.getElementById('integration-summary').innerHTML = [
          ['12','Open findings'],['1','Pending approval'],['0','Failed jobs'],['Ready','Core API']
        ].map(([value,label]) => `<div class="metric-card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`).join('');
        doc.getElementById('integration-config').hidden = true;
        doc.getElementById('intelligence-summary').innerHTML = [
          ['4','Recorded jobs'],['1','Queued'],['0','Running'],['0','Failed']
        ].map(([value,label]) => `<div class="metric-card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`).join('');
        doc.getElementById('intelligence-bridge-pill').textContent = 'Ready';
        doc.getElementById('intelligence-bridge-detail').innerHTML = '<div class="kv-row"><div class="kv-key">Queue mode</div><div class="kv-val">Local SQLite</div></div><div class="kv-row"><div class="kv-key">Codex</div><div class="kv-val">codex-cli 0.144.6</div></div><div class="kv-row"><div class="kv-key">Authentication</div><div class="kv-val">ChatGPT subscription</div></div><div class="kv-row"><div class="kv-key">Background service</div><div class="kv-val">Not installed</div></div><div class="kv-row"><div class="kv-key">Credential storage</div><div class="kv-val">Codex-owned; not stored by dashboard</div></div>';
        doc.getElementById('intelligence-mcp-pill').textContent = 'Setup required';
        doc.getElementById('intelligence-mcp-detail').innerHTML = '<div class="kv-row"><div class="kv-key">Mode</div><div class="kv-val">Read-only OAuth MCP</div></div><div class="kv-row"><div class="kv-key">Endpoint</div><div class="kv-val">Not configured in this dashboard</div></div><div class="kv-row"><div class="kv-key">Available tools</div><div class="kv-val">9 read-only tools</div></div><div class="kv-row"><div class="kv-key">Write access</div><div class="kv-val">None</div></div>';
        doc.getElementById('intelligence-autopilot-pill').textContent = 'Guarded';
        doc.getElementById('intelligence-autopilot-mode').value = 'guarded';
        doc.getElementById('intelligence-autopilot-confidence').value = '97';
        doc.getElementById('intelligence-autopilot-evidence').value = '2';
        doc.getElementById('intelligence-autopilot-limit').value = '10';
        doc.getElementById('intelligence-autopilot-summary').innerHTML = [
          ['1','Awaiting model'],['7','Auto-closed'],['3','Escalated'],['2','Tuning proposals']
        ].map(([value,label]) => `<div class="metric-card"><div class="metric">${value}</div><div class="metric-label">${label}</div></div>`).join('');
        doc.getElementById('intelligence-autopilot-runs').innerHTML = '<div class="table-wrap"><table><thead><tr><th>Finding</th><th>Decision</th><th>Model assessment</th><th>Guardrail</th><th>Updated</th><th>Action</th></tr></thead><tbody><tr><td><strong>SCM-77A9</strong><div class="small mono">ATR-1234567890ABCDEF</div></td><td><span class="agent-triage-action">Auto closed: false positive</span></td><td>False positive<div class="small">99% confidence</div></td><td class="agent-triage-reasons"><span class="small">Passed applicable gates</span></td><td>28 Jul, 04:42</td><td><button class="mini-btn">Rollback</button></td></tr><tr><td><strong>EDGE-19F2</strong><div class="small mono">ATR-FEDCBA0987654321</div></td><td><span class="agent-triage-action">Auto started review</span></td><td>Needs more evidence<div class="small">78% confidence</div></td><td class="agent-triage-reasons">Deterministic analysis does not independently support closure</td><td>28 Jul, 04:40</td><td></td></tr></tbody></table></div>';
        doc.getElementById('intelligence-autopilot-proposals').innerHTML = '<div class="module-head compact-header"><div><h4>Detection tuning</h4><p>Model proposals stay in shadow mode until deterministic historical replay proves the exact threshold change.</p></div></div><div class="table-wrap"><table><thead><tr><th>Target</th><th>Change</th><th>Shadow result</th><th>Evidence set</th><th>Action</th></tr></thead><tbody><tr><td><strong>npm</strong><div class="small mono">DTP-1234567890ABCDEF</div></td><td>Threshold<div class="small">Raise the boundary to the replay-proven score.</div></td><td>Shadow passed<div class="small">Activation permitted by replay</div></td><td>42 labeled<div class="small">19 safe · 23 risky</div></td><td></td></tr></tbody></table></div>';
        doc.getElementById('intelligence-jobs-table').innerHTML = `
          <div class="intelligence-pipeline-list" role="list">
            <article class="intelligence-pipeline-card" role="listitem">
              <header class="intelligence-pipeline-card-head">
                <div class="intelligence-pipeline-identity"><span class="intelligence-pipeline-label">Research case pipeline</span><code>RSC-42C6208F1F22</code><span class="small">Target <code>RSC-42C6208F1F22</code></span></div>
                <span class="status-pill success">Succeeded</span>
              </header>
              <div class="intelligence-pipeline-card-grid">
                <div class="intelligence-pipeline-field intelligence-pipeline-stages"><span class="intelligence-pipeline-label">Stage progress</span><strong>3 of 3 complete</strong><div class="intelligence-stage-list"><span class="intelligence-stage stage-succeeded">✓ Evidence review</span><span class="intelligence-stage stage-succeeded">✓ Analyst brief</span></div></div>
                <div class="intelligence-pipeline-field"><span class="intelligence-pipeline-label">Provider</span><code>opencodex:google-antigravity/claude-opus-4-6-thinking</code></div>
                <div class="intelligence-pipeline-field"><span class="intelligence-pipeline-label">Assessment</span><strong>Likely · 85% confidence</strong></div>
                <div class="intelligence-pipeline-field"><span class="intelligence-pipeline-label">Updated</span><time>25 Aug 2026, 02:28</time></div>
              </div>
              <footer class="intelligence-pipeline-card-footer">
                <details class="intelligence-child-jobs"><summary>3 stages · 4 attempts retained</summary></details>
                <div class="intelligence-pipeline-next"><span><span class="intelligence-pipeline-label">Next action</span><strong class="intelligence-pipeline-next-copy">Review completed pipeline</strong></span><button id="preview-open-full-analysis" class="secondary-btn mini-btn" type="button">Open latest analysis</button></div>
              </footer>
            </article>
            <article class="intelligence-pipeline-card" role="listitem">
              <header class="intelligence-pipeline-card-head">
                <div class="intelligence-pipeline-identity"><span class="intelligence-pipeline-label">Finding pipeline</span><code>RSCF-6A3223A19D7EF8E8</code><span class="small">Target <code>RSCF-6A3223A19D7EF8E8</code></span></div>
                <span class="status-pill warning">Running</span>
              </header>
              <div class="intelligence-pipeline-card-grid">
                <div class="intelligence-pipeline-field intelligence-pipeline-stages"><span class="intelligence-pipeline-label">Stage progress</span><strong>1 of 3 complete</strong><div class="intelligence-stage-list"><span class="intelligence-stage stage-running">• Evidence review</span><span class="intelligence-stage stage-pending">○ Independent review</span></div></div>
                <div class="intelligence-pipeline-field"><span class="intelligence-pipeline-label">Provider</span><code>opencodex:xai/xai-grok-4.6</code></div>
                <div class="intelligence-pipeline-field"><span class="intelligence-pipeline-label">Assessment</span><strong>Awaiting final assessment</strong></div>
                <div class="intelligence-pipeline-field"><span class="intelligence-pipeline-label">Updated</span><time>31 Aug 2026, 16:47</time></div>
              </div>
              <footer class="intelligence-pipeline-card-footer">
                <details class="intelligence-child-jobs"><summary>3 stages · 7 attempts retained</summary></details>
                <div class="intelligence-pipeline-next"><span><span class="intelligence-pipeline-label">Next action</span><strong class="intelligence-pipeline-next-copy">Monitor active stage</strong></span></div>
              </footer>
            </article>
          </div>`;
        const modal = doc.getElementById('intelligence-result-modal');
        const openResult = () => {
          doc.getElementById('intelligence-result-title').textContent = 'Analyze Research Case';
          doc.getElementById('intelligence-result-subtitle').textContent = 'AIJ-3356D244D94345D6 · RSC-42C6208F1F22 · opencodex:google-antigravity';
          doc.getElementById('intelligence-result-body').innerHTML = `
            <div class="intelligence-result-meta"><span>Succeeded</span><span>25 Jul, 02:28</span><span>Read-only analysis</span></div>
            <div class="intelligence-verdict"><span>Agent verdict</span><strong>Likely</strong><b>85% confidence</b></div>
            <div class="intelligence-result-grid">
              <section class="intelligence-result-section wide"><h4>Executive summary</h4><p>Independent static validation supports a likely Braintree.Net typosquat with suspicious package behavior. Runtime card-skimming behavior is not yet proven.</p></section>
              <section class="intelligence-result-section tone-decision"><h4>Verdict rationale</h4><p>Package identity, hashes, lifecycle behavior, network indicators, and comparison evidence support escalation, while the credible threshold remains blocked by missing sandbox or advisory confirmation.</p></section>
              <section class="intelligence-result-section"><h4>Risk assessment</h4><p>High research priority because the package impersonates a payment library and exposes payment- and browser-related indicators.</p></section>
              <section class="intelligence-result-section tone-fact"><h4>Confirmed facts</h4><ol class="intelligence-result-list"><li>The suspicious package identity and version were collected from NuGet.</li><li>Artifact hashes and static indicators are recorded with provenance.</li><li>Install-hook, browser-payment-access, and network-endpoint indicators were detected statically.</li></ol></section>
              <section class="intelligence-result-section"><h4>Reasonable inferences</h4><ol class="intelligence-result-list"><li>The naming pattern is consistent with brand impersonation.</li><li>The indicators justify deeper .NET comparison and sandbox review.</li></ol></section>
              <section class="intelligence-result-section tone-warning"><h4>Unsupported claims</h4><ol class="intelligence-result-list"><li>Active credit-card skimming is not proven without observed runtime behavior.</li><li>Victims, attribution, and campaign scope are not established.</li></ol></section>
              <section class="intelligence-result-section tone-gap"><h4>Missing evidence</h4><ol class="intelligence-result-list"><li>Approved isolated sandbox execution and sanitized behavior logs.</li><li>Independent collection of every referenced package version.</li><li>Structured IOC extraction and validation.</li></ol></section>
              <section class="intelligence-result-section tone-action wide"><h4>Recommended next steps</h4><ol class="intelligence-result-list"><li>Compare suspicious and legitimate assemblies, metadata, resources, strings, and public APIs.</li><li>Request approval-gated sandbox analysis for the exact recorded artifact hash.</li><li>Prepare responsible disclosure for NuGet and the impersonated vendor after evidence review.</li></ol></section>
              <section class="intelligence-result-section tone-warning"><h4>Publication risks</h4><ol class="intelligence-result-list"><li>Describe static indicators separately from observed behavior.</li><li>Do not claim original discovery or confirmed skimming without source-backed proof.</li></ol></section>
              <section class="intelligence-result-section wide"><h4>Job audit history</h4><ol class="intelligence-result-list"><li>Queued by dashboard operator.</li><li>Claimed by local bridge.</li><li>Gemini analysis completed and normalized.</li></ol></section>
            </div>`;
          modal.classList.remove('hidden');
          modal.setAttribute('aria-hidden', 'false');
          doc.body.classList.add('modal-open');
        };
        const closeResult = () => {
          modal.classList.add('hidden');
          modal.setAttribute('aria-hidden', 'true');
          doc.body.classList.remove('modal-open');
        };
        doc.getElementById('preview-open-full-analysis').addEventListener('click', openResult);
        doc.getElementById('intelligence-result-close').addEventListener('click', closeResult);
        doc.getElementById('intelligence-result-done').addEventListener('click', closeResult);
        doc.querySelectorAll('#page-automation [data-automation-view]:not([data-automation-view="jobs"])').forEach(section => section.hidden = true);
      }, { once: true });
      frame.srcdoc = withoutScripts;
    });
  </script>
</body>
</html>
