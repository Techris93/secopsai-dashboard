name: Deploy dashboard to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check Cloudflare deployment configuration
        id: config
        # Require Cloudflare deployment configuration before release.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required for the production Pages workflow" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required for the production Pages workflow" >&2; exit 1; }
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Pages output
        if: steps.config.outputs.configured == 'true'
        working-directory: secopsai-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.131.1 pages deploy . --project-name secopsai-dashboard --branch main

      - name: Verify deployed Pages artifact and security headers
        env:
          PAGES_SMOKE_URL: https://secopsai-dashboard.pages.dev
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          config_file="$(mktemp)"
          ontology_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file" "$config_file" "$ontology_file"' EXIT
          curl --fail --silent --show-error --location --max-time 30 --retry 5 --retry-delay 5 --dump-header "$headers_file" "$PAGES_SMOKE_URL/" -o "$body_file"
          grep -Eiq '^content-security-policy:' "$headers_file"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$headers_file"
          grep -Eiq 'SecOpsAI|app-shell|operator' "$body_file"
          curl --fail --silent --show-error --location --max-time 30 --retry 5 --retry-delay 5 "$PAGES_SMOKE_URL/config.js" -o "$config_file"
          grep -q 'window.SECOPSAI_CONFIG' "$config_file"
          ! grep -Eiq 'DASHBOARD_LOCAL_AUTH_TOKEN|TRIAGE_OPS_ADMIN_TOKEN|BLOG_OPS_ADMIN_TOKEN|INTELLIGENCE_ADMIN_TOKEN|SECOPSAI_CORE_(READ|INTELLIGENCE)_TOKEN|SECOPSAI_HELPER_AUTH_TOKEN' "$config_file"

          # The ontology proxy is operator-authenticated.  An unauthenticated
          # request must reach the Worker and be rejected by auth (401), not
          # fall through to Pages' static 404 handler.  This catches stale
          # artifacts, wrong route prefixes, and root-vs-nested deployments.
          ontology_status="$(curl --silent --show-error --location --max-time 30 --retry 5 --retry-delay 5 \
            --output "$ontology_file" --write-out '%{http_code}' \
            "$PAGES_SMOKE_URL/api/secopsai/ontology/search?q=&limit=1")"
          test "$ontology_status" = "401" || {
            echo "Expected hosted ontology proxy to reject unauthenticated access with HTTP 401, got ${ontology_status}" >&2
            cat "$ontology_file" >&2
            exit 1
          }
          grep -Eq 'operator_session_(required|invalid)' "$ontology_file"
