name: Deploy dashboard to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secopsai-dashboard-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check Cloudflare deployment configuration
        id: config
        # Require Cloudflare deployment configuration before release.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required for the production Pages workflow" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required for the production Pages workflow" >&2; exit 1; }
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Pages output
        if: steps.config.outputs.configured == 'true'
        working-directory: secopsai-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.131.1 pages deploy . --project-name secopsai-dashboard --branch main

      - name: Verify deployed Pages artifact and security headers
        env:
          PAGES_SMOKE_URL: https://secopsai-dashboard.pages.dev
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # One pass over every check; prints the first failing reason.
          verify() {
            curl --fail --silent --show-error --location --max-time 30 \
              --dump-header "$work/headers" "$PAGES_SMOKE_URL/" -o "$work/body" || { echo "root page request failed"; return 1; }
            grep -Eiq '^content-security-policy:' "$work/headers" || { echo "missing Content-Security-Policy header"; return 1; }
            grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$work/headers" || { echo "missing X-Content-Type-Options header"; return 1; }
            grep -Eiq 'SecOpsAI|app-shell|operator' "$work/body" || { echo "root page is not the console"; return 1; }
            curl --fail --silent --show-error --location --max-time 30 "$PAGES_SMOKE_URL/config.js" -o "$work/config" || { echo "config.js request failed"; return 1; }
            grep -q 'window.SECOPSAI_CONFIG' "$work/config" || { echo "config.js has no SECOPSAI_CONFIG"; return 1; }
            if grep -Eiq 'DASHBOARD_LOCAL_AUTH_TOKEN|TRIAGE_OPS_ADMIN_TOKEN|BLOG_OPS_ADMIN_TOKEN|INTELLIGENCE_ADMIN_TOKEN|SECOPSAI_CORE_(READ|INTELLIGENCE)_TOKEN|SECOPSAI_HELPER_AUTH_TOKEN' "$work/config"; then
              echo "SECURITY: config.js exposes a server credential name"; return 2
            fi
            # The ontology proxy is operator-authenticated: an unauthenticated
            # request must reach the Worker and get 401, not Pages' static 404.
            status="$(curl --silent --show-error --location --max-time 30 --output "$work/ontology" --write-out '%{http_code}' \
              "$PAGES_SMOKE_URL/api/secopsai/ontology/search?q=&limit=1")"
            [ "$status" = "401" ] || { echo "ontology proxy returned HTTP $status, expected 401: $(head -c 200 "$work/ontology")"; return 1; }
            grep -Eq 'operator_session_(required|invalid)' "$work/ontology" || { echo "ontology 401 without operator_session code"; return 1; }
            return 0
          }

          # A new deployment takes a little while to replace the previous one
          # everywhere; retry the whole set instead of failing on the first blip.
          for attempt in $(seq 1 12); do
            # GitHub runs steps with bash -e; capture the status explicitly.
            rc=0; reason="$(verify)" || rc=$?
            if [ $rc -eq 0 ]; then echo "Deployed dashboard verified (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt: $reason"
            [ $rc -eq 2 ] && exit 1   # never retry a credential exposure
            sleep 15
          done
          echo "::error::Deployed dashboard failed verification: $reason"
          exit 1
